name: test golden taint

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  golden-taint:
    name: golden test - taint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up java 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: build taint-test test project
        run: mvn -B -f test/taint-test/pom.xml -DskipTests package
      - name: prepare jar
        run: cp test/taint-test/target/taint-test-*.jar taint-test.jar
      - name: run golden taint test
        run: mvn -B test -Dtest=TaintGoldenTest -DfailIfNoTests=true
      - name: upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-golden-taint
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: clean
        if: always()
        run: rm -f taint-test.jar jar-analyzer.db jar-analyzer.db-wal jar-analyzer.db-shm

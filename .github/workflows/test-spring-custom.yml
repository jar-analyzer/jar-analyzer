name: test custom

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  spring-custom:
    name: spring core test - custom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up java 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: build test-springboot test project
        run: mvn -B -f test/test-springboot/pom.xml -DskipTests package
      - name: prepare jar
        run: cp test/test-springboot/target/test-0.0.1-SNAPSHOT.jar .
      - name: run maven custom test
        run: mvn -B test -Dtest=SpringCustomTest#testRun -DfailIfNoTests=true
      - name: upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-spring-custom
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: clean test file
        if: always()
        run: rm -f test-0.0.1-SNAPSHOT.jar jar-analyzer.db jar-analyzer.db-wal jar-analyzer.db-shm

name: test unit

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  unit:
    name: junit unit tests (jdk ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '8', '17', '25' ]
    steps:
      - uses: actions/checkout@v6

      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: run pure unit tests
        run: |
          mvn -B test \
            -Dsurefire.excludes='**/SpringCoreTest.java,**/SpringCustomTest.java' \
            -DfailIfNoTests=true

      - name: upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-unit-jdk${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: ignore

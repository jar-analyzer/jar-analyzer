name: test golden simple

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  golden-simple:
    name: golden test - string/spring simple (jdk ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '8', '17', '25' ]
    steps:
      - uses: actions/checkout@v6
      - name: set up java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven
      - name: build springboot-simple test project
        run: mvn -B -f test/springboot-simple/pom.xml -DskipTests package
      - name: prepare jar
        run: cp test/springboot-simple/target/springboot-simple-*.jar simple-test.jar
      - name: run golden simple test
        run: mvn -B test -Dtest=SimpleGoldenTest -DfailIfNoTests=true
      - name: upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-golden-simple-jdk${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: clean
        if: always()
        run: rm -f simple-test.jar jar-analyzer.db jar-analyzer.db-wal jar-analyzer.db-shm
